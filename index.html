<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CommanderVault</title>
  <meta name="description" content="Puntúa los comandantes de Magic que has jugado, guarda sus listas y lleva tus victorias y derrotas.">
  <meta name="theme-color" content="#0b0d14">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeos
    try {
      var t = (JSON.parse(localStorage.getItem('commandervault:settings') || 'null') || (JSON.parse(localStorage.getItem('commandervault:v1') || '{}').settings) || {}).theme || 'system';
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Saltar al contenido</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="CommanderVault, inicio">
      <img src="icons/icon.svg" alt="" width="34" height="34">
      <span>Commander<b>Vault</b></span>
    </a>
    <nav class="nav-desktop" aria-label="Principal">
      <a href="#/" data-nav="collection">Colección</a>
      <a href="#/wishlist" data-nav="wishlist">Por jugar</a>
      <a href="#/stats" data-nav="stats">Estadísticas</a>
      <a href="#/settings" data-nav="settings">Ajustes</a>
    </nav>
    <div class="topbar-actions">
      <button class="btn btn-ghost add-desktop" data-action="quick-log" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
        Registrar partida
      </button>
      <button class="btn btn-primary add-desktop" data-action="new" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nuevo comandante
      </button>
      <a href="#/settings" class="user-chip" id="user-chip" hidden aria-label="Tu cuenta">
        <span class="avatar"></span><span class="sync-dot" aria-hidden="true"></span>
      </a>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Navegación">
    <a href="#/" data-nav="collection">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span>Colección</span>
    </a>
    <a href="#/wishlist" data-nav="wishlist">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></svg>
      <span>Por jugar</span>
    </a>
    <button class="fab" data-action="add-sheet" type="button" aria-label="Añadir">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <a href="#/stats" data-nav="stats">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 15v2M12 10v7M17 6v11"/></svg>
      <span>Estadísticas</span>
    </a>
    <a href="#/settings" data-nav="settings">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
      <span>Ajustes</span>
    </a>
  </nav>

  <dialog id="modal" class="modal" aria-modal="true"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p style="padding:2rem;text-align:center">CommanderVault necesita JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
